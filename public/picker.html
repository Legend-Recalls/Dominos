<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Order — Dominoes Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="content">
        <div class="page-head">
            <h1>🔀 Seating Order</h1>
            <p id="tName"></p>
        </div>

        <div class="picker-stage">
            <div class="tile" style="padding:1.5rem 2rem;">
                <p class="hint" style="text-align:center; margin-top:0;">Players</p>
                <div id="playerArea" style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center;"></div>
            </div>

            <button class="btn btn-lg" id="shuffleBtn">🎲 Reveal Seating Order</button>
            <ol class="order-list" id="orderList" hidden></ol>
            <a href="#" id="backLink" class="btn btn-ghost">← Back to tournament</a>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        Arena.mount();
        const tid = Arena.qs('id');
        document.getElementById('backLink').href = '/tournament.html?id=' + encodeURIComponent(tid);

        let players = [];

        (async function () {
            try {
                const t = await Arena.api('/tournaments/' + tid);
                players = t.players;
                document.getElementById('tName').textContent = t.name;
                const area = document.getElementById('playerArea');
                players.forEach((p) => {
                    const pill = Arena.pill(p);
                    pill.style.background = 'var(--felt)';
                    area.appendChild(pill);
                });
            } catch (e) {
                document.getElementById('tName').textContent = 'Tournament not found';
                Arena.toast(e.message, true);
            }
        })();

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        const btn = document.getElementById('shuffleBtn');
        btn.addEventListener('click', function () {
            if (players.length === 0) return;
            const order = shuffle(players);
            const list = document.getElementById('orderList');
            list.innerHTML = '';
            list.hidden = false;
            order.forEach((name, i) => {
                const li = document.createElement('li');
                li.className = 'tile order-item';
                li.style.animationDelay = (i * 0.09) + 's';
                const seat = document.createElement('span');
                seat.className = 'seat';
                seat.textContent = i + 1;
                const label = document.createElement('span');
                label.textContent = name;
                li.append(seat, label);
                list.appendChild(li);
            });
            btn.textContent = '🔁 Shuffle Again';
        });
    </script>
</body>
</html>
