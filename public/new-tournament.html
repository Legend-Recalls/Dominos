<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tournament — Dominoes Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="content">
        <div class="panel tile">
            <h1>Create Tournament</h1>
            <div class="field">
                <label for="name">Tournament name</label>
                <input type="text" id="name" placeholder="Friday Night Bones" required>
            </div>

            <div class="field">
                <label>Players</label>
                <div class="player-pills" id="pills"></div>
                <div style="display:flex; gap:0.5rem;">
                    <input type="text" id="playerInput" placeholder="Add a player and press Enter">
                    <button type="button" class="btn btn-sm" id="addPlayerBtn">Add</button>
                </div>
                <p class="hint">Add 2 or more players. Tip: press Enter to add quickly.</p>
            </div>

            <button type="button" class="btn btn-lg" id="createBtn">🁫 Create Tournament</button>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        Arena.mount();

        const players = [];
        const pills = document.getElementById('pills');
        const input = document.getElementById('playerInput');

        function render() {
            pills.innerHTML = '';
            players.forEach((name, i) => {
                pills.appendChild(Arena.pill(name, () => { players.splice(i, 1); render(); }));
            });
        }

        function add() {
            const name = input.value.trim();
            if (!name) return;
            if (players.includes(name)) { Arena.toast('Player already added', true); return; }
            players.push(name);
            input.value = '';
            render();
            input.focus();
        }

        document.getElementById('addPlayerBtn').addEventListener('click', add);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); add(); }
        });

        document.getElementById('createBtn').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            if (!name) { Arena.toast('Give the tournament a name', true); return; }
            if (players.length < 2) { Arena.toast('Add at least 2 players', true); return; }
            try {
                const t = await Arena.api('/tournaments', {
                    method: 'POST',
                    body: JSON.stringify({ name, players })
                });
                location.href = '/tournament.html?id=' + encodeURIComponent(t.id);
            } catch (e) {
                Arena.toast(e.message, true);
            }
        });
    </script>
</body>
</html>
